<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Study-Dash — Profile</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <button id="menu-btn">☰</button>
    <div id="side-menu" class="closed"><button id="menu-close">✕</button><nav>
      <button class="menu-link" data-href="/">DASHBOARD</button>
      <button class="menu-link" data-href="/history">History</button>
      <button class="menu-link" data-href="/goals">Goals</button>
      <button class="menu-link" data-href="/library">The Library</button>
    </nav></div>
    <main>
      <h1 class="title">Your Profile</h1>
      <section class="panel profile-panel">
        <div class="profile-preview"><div id="profile-preview-avatar" class="profile-avatar profile-avatar-large">?</div><div><h2 id="profile-preview-name">Hello there!</h2><p>Set up your profile so the dashboard can greet you.</p></div></div>
        <form id="profile-form" enctype="multipart/form-data">
          <label>Name <input name="name" type="text" required placeholder="Your name"></label>
          <label>Email <input name="email" type="email" required placeholder="you@example.com"></label>
          <label>Profile picture <input name="avatar" type="file" accept="image/png,image/jpeg,image/webp"></label>
          <button class="btn-accent" type="submit">Save profile</button>
          <div id="profile-message" class="hint" role="status"></div>
        </form>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
