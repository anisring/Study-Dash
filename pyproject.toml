[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "study-dash"
version = "0.1.3"
description = "A local KCET study dashboard"
readme = "README.md"
requires-python = ">=3.9"
urls = {Repository = "https://github.com/anisring/Study-Dash"}
dependencies = [
    "Flask>=2.0",
    "matplotlib>=3.0",
    "openpyxl>=3.1",
    "pypdf>=5.0",
]

[project.scripts]
study-dash = "app:main"

[tool.setuptools]
py-modules = ["app", "db", "charts", "stats", "study", "study_gui"]

[tool.setuptools.data-files]
"share/study-dash/templates" = ["templates/*.html"]
"share/study-dash/static" = ["static/*"]